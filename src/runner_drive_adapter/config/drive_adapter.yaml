drive_adapter:
  ros__parameters:
    wheelbase: 0.178
    max_steering_angle: 0.3614
    steering_min_speed: 0.05

    # Monotonic steady-state feedforward measurements. The measured
    # 0.370 -> 0.209 m/s point is excluded: it was a single noisy sample with
    # run standard deviation 0.094 m/s, while 0.360 was measured twice at
    # 0.229 and 0.237 m/s.
    throttle_breakpoints: [0.340, 0.350, 0.360, 0.380]
    speed_breakpoints: [0.126, 0.188, 0.233, 0.290]

    minimum_moving_speed: 0.126
    floor_promotion_min_ratio: 0.50
    maximum_commanded_speed: 0.60

    proportional_gain: 0.30
    integral_gain: 0.12
    integrator_min: -0.25
    integrator_max: 0.16
    output_min: -0.20
    output_max: 0.70
    breakaway_integrator_preload: 0.04

    encoder_metres_per_edge: 0.010282
    wheelspin_speed_ratio: 1.50
    wheelspin_min_speed_excess: 0.10
    wheelspin_qualification_sec: 0.20
    motion_signal_timeout_sec: 0.25
    encoder_state_timeout_sec: 0.25

    cmd_vel_nav_timeout: 0.25
    publication_rate: 20.0
