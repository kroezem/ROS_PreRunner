drive_adapter:
  ros__parameters:
    wheelbase: 0.178
    max_steering_angle: 0.3614
    steering_min_speed: 0.05

    # Monotonic steady-state feedforward measurements. The measured
    # 0.370 -> 0.209 m/s point is excluded: it was a single noisy sample with
    # run standard deviation 0.094 m/s, while 0.360 was measured twice at
    # 0.229 and 0.237 m/s.
    throttle_breakpoints: [0.340, 0.350, 0.360, 0.380]
    speed_breakpoints: [0.126, 0.188, 0.233, 0.290]

    minimum_moving_speed: 0.126
    floor_promotion_min_ratio: 0.50

    # Bounded terrain assist. EKF body-forward velocity is primary; encoder
    # edge rate and pending command direction are the wheelspin cross-check.
    stall_assist_enabled: true
    under_speed_ratio: 0.40
    under_speed_absolute_ceiling: 0.10
    under_speed_qualification_sec: 0.30
    command_stability_tolerance: 0.02
    ramp_rate_per_sec: 0.10
    boost_throttle_ceiling: 0.50
    maximum_assist_duration_sec: 1.50
    motion_confirm_speed: 0.06
    motion_confirm_duration_sec: 0.20
    motion_hold_duration_sec: 0.30
    decay_rate_per_sec: 0.15
    overspeed_margin: 0.02
    wheelspin_edge_rate_threshold: 1.0
    wheelspin_vehicle_speed_threshold: 0.02
    wheelspin_qualification_sec: 0.25
    cooldown_duration_sec: 0.50
    motion_signal_timeout_sec: 0.25
    encoder_state_timeout_sec: 0.25

    cmd_vel_nav_timeout: 0.25
    publication_rate: 20.0
