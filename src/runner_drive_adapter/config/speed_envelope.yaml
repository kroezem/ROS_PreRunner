# Single launched origin for Runner longitudinal-control parameters.
#
# These values remain provisional until physically validated. Paddock's
# Speed Profile editor is authoritative for live operator tuning; it can
# apply a more conservative driving policy when required.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    FollowPath:
      desired_linear_vel: 1.00
      min_approach_linear_velocity: 0.25
      approach_velocity_scaling_dist: 0.40
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.75
      regulated_linear_scaling_min_speed: 0.40
      # D2's committed-path speed profile is now authoritative for
      # hazard-based slowdown. The stock cost-regulated scaler reacts to the
      # robot's *current* pose cost (and a short lookahead-to-carrot
      # segment) independent of the committed path, and would silently
      # fight or duplicate the profile from underneath it. Curvature-based
      # regulation and the collision-imminent safety check are unaffected.
      use_cost_regulated_linear_velocity_scaling: false
      inflation_cost_scaling_factor: 10.0
      cost_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.60

drive_adapter:
  ros__parameters:
    feedforward_effort_per_speed: 0.1188
    feedforward_effort_intercept: 0.0174
    minimum_moving_speed: 0.25
    maximum_commanded_speed: 1.00
    proportional_gain: 0.05
    integral_gain: 0.01
    integrator_bound: 0.005
    output_min: 0.0
    output_max: 0.14
    encoder_metres_per_edge: 0.010282
    encoder_state_timeout_sec: 0.25
    cmd_vel_nav_timeout: 0.25
    publication_rate: 20.0
