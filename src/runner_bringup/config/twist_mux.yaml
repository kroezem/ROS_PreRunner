twist_mux:
  ros__parameters:
    # Jazzy twist_mux 4.5 defaults to TwistStamped unless this is explicit.
    use_stamped: false
    topics:
      # Supervised Paddock autonomy. Sole writer: runner_command_authority,
      # which publishes here only while every autonomy interlock holds and
      # goes silent (after a bounded brake) on revoke. Lowest priority: local
      # DualSense teleop and the global STOP zero both override it. The 0.30 s
      # timeout matches the authority's 20 Hz supervised cadence with margin;
      # a stale autonomy sample simply drops out of arbitration.
      autonomy:
        topic: /cmd_vel_auto
        timeout: 0.30
        priority: 50
      # Supervised browser manual output. The command authority is its sole
      # writer and sends a bounded brake transition before becoming silent.
      paddock_manual:
        topic: /cmd_vel_paddock
        timeout: 0.30
        priority: 75
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.15
        priority: 100
      global_stop:
        topic: /cmd_vel_stop
        timeout: 0.10
        priority: 255
    locks:
      global_stop:
        topic: /paddock/stop_lock
        timeout: 0.15
        priority: 200
