twist_mux:
  ros__parameters:
    # Jazzy twist_mux 4.5 defaults to TwistStamped unless this is explicit.
    use_stamped: false
    topics:
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.15
        priority: 100
      global_stop:
        topic: /cmd_vel_stop
        timeout: 0.10
        priority: 255
    locks:
      global_stop:
        topic: /paddock/stop_lock
        timeout: 0.15
        priority: 200
