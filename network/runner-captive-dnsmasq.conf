# NetworkManager reads this file only for its per-connection "shared" dnsmasq.
# Resolve ordinary DNS probes to the local landing page while the field AP is
# offline.  Multicast .local lookup remains Avahi's responsibility.
address=/#/10.42.0.1

# RFC 8910 captive-portal DHCP option, understood by current Apple and other
# clients.  Legacy HTTP probes are handled by the wildcard answer above.
dhcp-option=114,http://10.42.0.1/
